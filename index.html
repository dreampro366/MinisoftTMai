<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minisoft(tm) OS Terminal</title>
    <!-- Linking your external style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="terminal">
        <div id="output">
            MINISOFT(TM) TERMINAL [Version 2.4.0]<br>
            (C) 2026 MINISOFT CORPORATION. ALL RIGHTS RESERVED.<br>
            KERNEL STATUS: <span style="color: #22ff22;">ONLINE</span><br>
            --------------------------------------------------
        </div>
        <div class="input-line">
            <span class="prompt">C:\USERS\CEO></span>
            <input type="text" id="user-input" autofocus autocomplete="off">
        </div>
    </div>

    <script>
        const input = document.getElementById('user-input');
        const output = document.getElementById('output');
        
        // This is your official Minisoft(tm) Backend link
        const API_URL = 'https://minisofttmai.onrender.com/chat'; 

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const userMessage = input.value;
                if (!userMessage.trim()) return;

                // Display user command in the terminal
                output.innerHTML += `<div><span class="prompt">C:\\USERS\\CEO></span> ${userMessage}</div>`;
                input.value = '';
                
                // Scroll to bottom
                output.scrollTop = output.scrollHeight;

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMessage })
                    });

                    const data = await response.json();
                    
                    // Display AI response
                    output.innerHTML += `<div class="ai-reply">${data.response}</div>`;
                } catch (error) {
                    output.innerHTML += `<div class="error">SYSTEM ERROR: Could not connect to Minisoft(tm) Kernel.</div>`;
                }

                // Auto-scroll after reply
                output.scrollTop = output.scrollHeight;
            }
        });
    </script>
</body>
</html>
