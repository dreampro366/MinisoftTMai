<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisoftTMai - Terminal</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background-color: #0c0c0c; color: #33ff33; font-family: 'Courier New', monospace; padding: 20px; margin: 0; overflow: hidden; }
        #terminal-container { max-width: 1000px; height: 85vh; margin: 0 auto; border: 1px solid #333; background: #000; padding: 15px; display: flex; flex-direction: column; }
        #output { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap; font-size: 1.1em; }
        .input-area { display: flex; align-items: center; }
        .prompt { color: #66ccff; margin-right: 10px; font-weight: bold; }
        input { background: transparent; border: none; color: #f1f1f1; font-family: inherit; font-size: 1.1em; outline: none; flex-grow: 1; }
        #bottom-bar { margin-top: 15px; text-align: center; font-size: 0.8em; color: #444; border-top: 1px solid #222; padding-top: 5px; }
    </style>
</head>
<body>
<div id="terminal-container">
    <div id="output">MinisoftTM Terminal [Version 1.2.0]
(c) 2026 Minisoft Corporation. All rights reserved.

Type 'help' to see commands.</div>
    <div class="input-area">
        <span class="prompt">C:/Users/Guest></span>
        <input type="text" id="cmd-input" autofocus autocomplete="off">
    </div>
</div>
<div id="bottom-bar">[ Kernel: Windows 2003 Lite ] | [ AI: Gemini Pro ]</div>

<script>
    const input = document.getElementById('cmd-input');
    const output = document.getElementById('output');
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const val = input.value;
            if (!val.trim()) return;
            printLine(`\nC:/Users/Guest> ${val}`);
            handleCommand(val.trim().toLowerCase());
            input.value = '';
            output.scrollTop = output.scrollHeight;
        }
    });
    function printLine(text) {
        const div = document.createElement('div');
        div.innerText = text;
        output.appendChild(div);
    }
    function handleCommand(cmd) {
        if (cmd === 'help') printLine("Commands: help, cls, ver, ai [msg]");
        else if (cmd === 'cls') output.innerText = 'MinisoftTM Terminal [Version 1.2.0]\n';
        else if (cmd === 'ver') printLine("MinisoftTM OS [LITE]");
        else if (cmd.startsWith('ai')) printLine("AI: Initializing connection... (Ready for input)");
        else printLine(`'${cmd}' is not recognized.`);
    }
</script>
</body>
</html>
