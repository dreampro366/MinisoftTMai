<!DOCTYPE html>
<html>
<head>
    <title>Minisoft(tm) Terminal</title>
    <style>
        body { background: #0a0a0a; color: #22ff22; font-family: monospace; padding: 20px; }
        #terminal { height: 90vh; overflow-y: auto; border: 1px solid #333; padding: 10px; }
        input { background: transparent; border: none; color: #22ff22; outline: none; width: 80%; }
        .ai-reply { color: white; margin: 10px 0; border-left: 2px solid #22ff22; padding-left: 10px; }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output">MINISOFT(TM) TERMINAL [Version 2.4.0]<br>ONLINE<br>---</div>
        <div>C:\USERS\DURSU> <input type="text" id="user-input" autofocus></div>
    </div>
    <script>
        const input = document.getElementById('user-input');
        const output = document.getElementById('output');
        // UPDATE THIS AFTER DEPLOYING TO RENDER
        const API_URL = 'YOUR_RENDER_URL_HERE/chat'; 

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = input.value;
                output.innerHTML += `<div>C:\\USERS\\DURSU> ${val}</div>`;
                input.value = '';
                fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: val})
                })
                .then(res => res.json())
                .then(data => {
                    output.innerHTML += `<div class="ai-reply">${data.response}</div>`;
                });
            }
        });
    </script>
</body>
</html>
